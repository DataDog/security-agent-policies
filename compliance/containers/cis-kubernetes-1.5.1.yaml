schema:
  version: 1.0.0
name: CIS Kubernetes
framework: cis-kubernetes
version: 1.5.1
rules:
  - id: cis-kubernetes-1.5.1-5.3.2
    description: Network policies should be defined to isolate traffic in cluster network
    scope:
      - kubernetesCluster
    input:
      - kubeApiserver:
          kind: namespaces
          version: v1
          apiRequest:
            verb: list
        type: array
        tag: namespaces
      - kubeApiserver:
          kind: networkpolicies
          version: v1
          group: networking.k8s.io
          apiRequest:
            verb: list
        type: array
        tag: networkpolicies
      - constants:
          resource_type: kubernetes_cluster
    imports:
      - helpers.rego
  - id: cis-kubernetes-1.5.1-5.7.4
    description: Resources should be created in a non-default namespace in Kubernetes
    scope:
      - kubernetesCluster
    input:
      - tag: pods
        type: array
        kubeApiserver:
          kind: pods
          version: v1beta1
          group: policy
          namespace: default
          apiRequest:
            verb: list
      - tag: services
        type: array
        kubeApiserver:
          kind: services
          version: v1
          namespace: default
          fieldSelector: metadata.name!=kubernetes,metadata.name!=openshift
          apiRequest:
            verb: list
      - constants:
          resource_type: kubernetes_cluster
    imports:
      - helpers.rego
