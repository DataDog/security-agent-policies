schema:
  version: 1.0.0
name: CIS Kubernetes
framework: cis-kubernetes
version: 1.5.1
rules:
  - id: cis-kubernetes-1.5.1-5.3.2
    description: Network policies should be defined to isolate traffic in cluster network
    scope:
      - kubernetesCluster
    input:
      - kubeApiserver:
          kind: namespaces
          version: v1
          apiRequest:
            verb: list
        type: array
        tag: namespaces
      - kubeApiserver:
          kind: networkpolicies
          version: v1
          group: networking.k8s.io
          apiRequest:
            verb: list
        type: array
        tag: networkpolicies
      - constants:
          resource_type: kubernetes_cluster
    imports:
      - helpers.rego
